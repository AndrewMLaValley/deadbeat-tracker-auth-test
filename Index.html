<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deadbeat Tracker Auth Test</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f4f7fb;
  font-family: Arial, sans-serif;
}

.card {
  width: min(90%, 420px);
  background: white;
  padding: 24px;
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

h1 {
  margin-top: 0;
  color: #12355b;
}

label {
  display: block;
  margin-top: 14px;
  margin-bottom: 5px;
  font-weight: bold;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  border: 1px solid #bfc9d6;
  border-radius: 8px;
}

.password-row {
  display: flex;
  gap: 8px;
}

.password-row input {
  flex: 1;
}

button {
  margin-top: 14px;
  padding: 11px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.primary {
  width: 100%;
  color: white;
  background: #1d73c9;
}

.secondary {
  width: 100%;
  color: #12355b;
  background: #e8eef6;
}

.eye {
  margin-top: 0;
  width: 44px;
  background: #e8eef6;
}

#message {
  margin-top: 14px;
  color: #b42318;
  white-space: pre-wrap;
}

.success {
  color: #13795b !important;
}
</style>
</head>

<body>
<div class="card">
  <h1>Deadbeat Tracker</h1>
  <p>Supabase Authentication Test</p>

  <label for="email">Email</label>
  <input id="email" type="email">

  <label for="password">Password</label>

  <div class="password-row">
    <input id="password" type="password">

    <button id="eyeButton" class="eye" type="button">
      👁
    </button>
  </div>

  <button id="signUpButton" class="primary" type="button">
    Create Account
  </button>

  <button id="signInButton" class="primary" type="button">
    Sign In
  </button>

  <button id="resetButton" class="secondary" type="button">
    Forgot Password
  </button>

  <button id="signOutButton" class="secondary" type="button">
    Sign Out
  </button>

  <div id="message"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://jjffdtsohryyubmjnq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_Z8T064Vr5NmU6-ICT1EZbQ_pn4so7Oe";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");
const eyeButton = document.getElementById("eyeButton");

function showMessage(text, success = false) {
  message.textContent = text;
  message.className = success ? "success" : "";
}

eyeButton.addEventListener("click", function() {
  if (password.type === "password") {
    password.type = "text";
    eyeButton.textContent = "🙈";
  } else {
    password.type = "password";
    eyeButton.textContent = "👁";
  }
});

document.getElementById("signUpButton").addEventListener(
  "click",
  async function() {
    showMessage("");

    const { error } = await supabase.auth.signUp({
      email: email.value.trim(),
      password: password.value,
      options: {
        emailRedirectTo:
          window.location.origin + window.location.pathname
      }
    });

    if (error) {
      showMessage(error.message);
      return;
    }

    showMessage(
      "Account created. Check your email and confirm the account.",
      true
    );
  }
);

document.getElementById("signInButton").addEventListener(
  "click",
  async function() {
    showMessage("");

    const { error } =
      await supabase.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });

    if (error) {
      showMessage(error.message);
      return;
    }

    showMessage("Signed in successfully.", true);
  }
);

document.getElementById("resetButton").addEventListener(
  "click",
  async function() {
    showMessage("");

    const { error } =
      await supabase.auth.resetPasswordForEmail(
        email.value.trim(),
        {
          redirectTo:
            window.location.origin + window.location.pathname
        }
      );

    if (error) {
      showMessage(error.message);
      return;
    }

    showMessage("Password-reset email sent.", true);
  }
);

document.getElementById("signOutButton").addEventListener(
  "click",
  async function() {
    await supabase.auth.signOut();
    showMessage("Signed out.", true);
  }
);

supabase.auth.onAuthStateChange(function(event, session) {
  if (session?.user) {
    showMessage(
      "Authenticated user: " + session.user.email,
      true
    );
  }
});
</script>
</body>
</html>
