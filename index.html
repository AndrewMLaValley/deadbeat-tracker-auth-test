<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#12355b">
  <title>Deadbeat Tracker</title>

  <style>
    :root{
      --navy:#12355b;
      --blue:#1d73c9;
      --green:#13795b;
      --red:#b42318;
      --bg:#f4f7fb;
      --text:#172033;
      --muted:#64748b;
      --border:#d9e1ec;
      --light:#e8eef6;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    button,input,select,textarea{font:inherit}

    button{
      border:0;
      border-radius:9px;
      padding:10px;
      cursor:pointer;
      font-weight:700;
    }

    input,select,textarea{
      width:100%;
      padding:11px;
      border:1px solid #bdc9d8;
      border-radius:9px;
      background:white;
      color:var(--text);
    }

    textarea{
      min-height:76px;
      resize:vertical;
    }

    .hidden{display:none!important}
    .screen{display:none;min-height:100vh}
    .screen.active{display:block}
    .page{display:none}
    .page.active{display:block}

    .auth-wrap{
      width:min(100%,440px);
      margin:auto;
      padding:60px 18px;
    }

    .app{
      width:min(100%,760px);
      min-height:100vh;
      margin:auto;
      padding-bottom:94px;
    }

    .card,.panel{
      background:white;
      border:1px solid var(--border);
      border-radius:14px;
      padding:16px;
      box-shadow:0 4px 16px rgba(18,53,91,.08);
    }

    header{
      padding:18px;
      color:white;
      background:var(--navy);
    }

    header h1{margin:0;font-size:1.3rem}
    header p{margin:4px 0 0;color:#cbdcf1;font-size:.85rem}

    main{padding:16px}

    h2{margin:0;font-size:1.15rem}

    .row,.heading{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .heading{margin:20px 0 10px}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:10px;
    }

    .group{margin-top:13px}

    label{
      display:block;
      margin-bottom:5px;
      font-size:.85rem;
      font-weight:750;
    }

    .sub{
      color:var(--muted);
      font-size:.85rem;
      line-height:1.4;
    }

    .primary{background:var(--blue);color:white}
    .secondary{background:var(--light);color:var(--navy)}
    .success{background:var(--green);color:white}
    .danger{background:var(--red);color:white}

    .wide{width:100%;margin-top:10px}

    .actions{
      display:flex;
      gap:8px;
      margin-top:15px;
    }

    .actions button{flex:1}

    .total{
      padding:20px;
      border-radius:15px;
      color:white;
      background:linear-gradient(135deg,#12355b,#1d73c9);
    }

    .total strong{
      display:block;
      margin-top:5px;
      font-size:2rem;
    }

    .card strong{
      display:block;
      margin-top:12px;
      font-size:1.35rem;
    }

    .interest{
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid var(--border);
      color:var(--muted);
      font-size:.8rem;
      line-height:1.45;
    }

    .list{
      width:100%;
      border:0;
      border-bottom:1px solid var(--border);
      border-radius:0;
      background:white;
      text-align:left;
    }

    .list:last-child{border-bottom:0}

    .nav{
      position:fixed;
      z-index:10;
      bottom:12px;
      left:50%;
      transform:translateX(-50%);
      display:grid;
      grid-template-columns:repeat(3,1fr);
      overflow:hidden;
      width:min(calc(100% - 24px),760px);
      border:1px solid var(--border);
      border-radius:13px;
      background:white;
      box-shadow:0 4px 16px rgba(18,53,91,.16);
    }

    .nav button{
      border-radius:0;
      color:var(--muted);
      background:white;
    }

    .nav .active{
      color:var(--blue);
      background:#f2f8ff;
    }

    .add{
      position:fixed;
      z-index:9;
      right:20px;
      bottom:84px;
      width:58px;
      height:58px;
      border-radius:50%;
      background:var(--blue);
      color:white;
      font-size:1.6rem;
      box-shadow:0 7px 18px rgba(29,115,201,.35);
    }

    .modal-bg{
      display:none;
      position:fixed;
      z-index:30;
      inset:0;
      padding:14px;
      align-items:flex-end;
      justify-content:center;
      background:rgba(0,0,0,.55);
    }

    .modal-bg.show{display:flex}

    .modal{
      width:min(100%,650px);
      max-height:90vh;
      overflow:auto;
      padding:17px;
      border-radius:17px 17px 9px 9px;
      background:white;
    }

    .close{
      width:36px;
      height:36px;
      padding:0;
      border-radius:50%;
      background:var(--light);
      color:var(--navy);
      font-size:1.2rem;
    }

    .password-row{
      display:grid;
      grid-template-columns:1fr 45px;
      gap:8px;
    }

    .eye{
      padding:0;
      background:var(--light);
      color:var(--navy);
    }

    .message{
      display:none;
      margin-top:15px;
      padding:11px;
      border-radius:9px;
      font-size:.9rem;
      line-height:1.4;
      background:var(--light);
      color:var(--navy);
    }

    .message.show{display:block}
    .message.error{background:#fdecea;color:var(--red)}
    .message.good{background:#e5f6ee;color:var(--green)}

    .notice{
      margin-top:12px;
      padding:11px;
      border-radius:9px;
      color:#725817;
      background:#fff9e8;
      font-size:.85rem;
      line-height:1.4;
    }

    .empty{
      padding:22px;
      color:var(--muted);
      text-align:center;
    }

    .tracker-name{
      margin:0;
      font-size:1.45rem;
      color:var(--navy);
    }

    .password-panel{
      display:none;
    }

    .password-panel.active{
      display:block;
    }

    @media(max-width:430px){
      .grid{grid-template-columns:1fr}
    }
  </style>
  <!-- Plaid Link JS -->

</head>

  <script>
    const SUPABASE_URL = "https://ljifsttsohryyuobmjnq.supabase.co";

    }

    function esc(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // NEW: render linked accounts into Settings
    function renderLinkedAccounts(accounts) {
      const container = $("linkedAccounts");
      if (!container) return;

      if (!accounts || !accounts.length) {
        container.textContent = "No bank accounts linked yet.";
        return;
      }

      container.innerHTML = accounts.map(acct => {
        const institution = acct.institution_name || "Bank";
        const name = acct.plaid_account_name || "Account";
        const last4 = acct.plaid_account_mask || "";
        const typeLabel = acct.plaid_account_type || "";
        const subtypeLabel = acct.plaid_account_subtype || "";

        const parts = [
          institution + ":",
          name,
          last4 ? "•••• " + last4 : "",
          typeLabel || "",
          subtypeLabel ? "(" + subtypeLabel + ")" : ""
        ];

        return `<div>${esc(parts.join(" ").replace(/\s+/g, " ").trim())}</div>`;
      }).join("");
    }

    // UPDATED: open Settings and load linked accounts
    function openSettings() {
      $("inviteCodeDisplay").textContent = currentTracker.invite_code;
      $("budgetInput").value = currentTracker.monthly_budget || 0;

    // NEW: load linked accounts from backend for current tracker
    async function loadLinkedAccountsForCurrentTracker() {
      if (!currentTracker) {
        renderLinkedAccounts([]);
        return;
      }

      try {
        const {
          data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session?.access_token) {
          renderLinkedAccounts([]);
          return;
        }

        const jwt = session.access_token;

        const url =
          "https://deadbeat-plaid-server.onrender.com/linked-accounts" +
          "?tracker_id=" + encodeURIComponent(currentTracker.id);

        const resp = await fetch(url, {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + jwt
          }
        });

        const data = await resp.json();

        if (!resp.ok) {
          console.error("loadLinkedAccounts error", data);
          renderLinkedAccounts([]);
          setMessage(
            "settingsMessage",
            data.error || "Could not load linked accounts.",
            "error"
          );
          return;
        }

        renderLinkedAccounts(data.accounts || []);
      } catch (e) {
        console.error("loadLinkedAccountsForCurrentTracker error", e);
        renderLinkedAccounts([]);
        setMessage("settingsMessage", "Error loading linked accounts.", "error");
      }
    }

    // Plaid Link integration (unchanged from your last version)
    async function linkBankAccount() {
      if (!currentTracker) {
        setMessage("settingsMessage", "Open a tracker before linking a bank.", "error");
        return;
      }

      try {
        setMessage("settingsMessage", "Requesting Plaid link token...", "");

        const {
          data: { session }
        } = await supabaseClient.auth.getSession();

        if (!session?.access_token) {
          setMessage("settingsMessage", "Not signed in.", "error");
          return;
        }

        const jwt = session.access_token;

        const resp = await fetch(
          "https://deadbeat-plaid-server.onrender.com/plaid-create-link-token",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + jwt
            },
            body: JSON.stringify({ tracker_id: currentTracker.id })
          }
        );

        const data = await resp.json();

        if (!resp.ok) {
          setMessage(
            "settingsMessage",
            data.error || "Failed to get Plaid link token.",
            "error"
          );
          return;
        }

        const linkToken = data.link_token;

        const handler = Plaid.create({
          token: linkToken,
          onSuccess: async function(public_token, metadata) {
            try {
              setMessage(
                "settingsMessage",
                "Exchanging public token and saving linked accounts...",
                ""
              );

              const exchangeResp = await fetch(
                "https://deadbeat-plaid-server.onrender.com/plaid-exchange-public-token",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + jwt
                  },
                  body: JSON.stringify({
                    public_token,
                    tracker_id: currentTracker.id
                  })
                }
              );

              const exchangeData = await exchangeResp.json();

              if (!exchangeResp.ok) {
                setMessage(
                  "settingsMessage",
                  exchangeData.error || "Failed to save linked accounts.",
                  "error"
                );
                return;
              }

              setMessage(
                "settingsMessage",
                "Bank account linked (Plaid sandbox) and saved to Supabase.",
                "good"
              );

              // Refresh linked accounts list in Settings after successful link
              loadLinkedAccountsForCurrentTracker();
            } catch (e) {
              console.error("exchange public_token error", e);
              setMessage(
                "settingsMessage",
                "Error exchanging public token.",
                "error"
              );
            }
          },
          onExit: function(err, metadata) {
            if (err) {
              console.error("Plaid Link exit with error", err);
              setMessage(
                "settingsMessage",
                "Plaid Link closed with an error: " +
                  (err.display_message || err.error_message || "See console"),
                "error"
              );
            } else {
              setMessage(
                "settingsMessage",
                "Plaid Link closed before linking an account.",
                "error"
              );
            }
          },
          onEvent: function(eventName, metadata) {
            console.log("Plaid Link event", eventName, metadata);
          }
        });

        handler.open();
      } catch (e) {
        console.error("linkBankAccount error", e);
        setMessage("settingsMessage", "Error requesting Plaid link token.", "error");
      }
    }

    document.querySelectorAll(".modal-bg").forEach(modal => {
      modal.addEventListener("click", event => {

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeModal("entryModal");
        closeModal("cardModal");

    });

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      if (session?.user) {
        currentUser = session.user;
      }
    });
