<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deadbeat Tracker — Supabase Connection Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .card {
      width: min(90%, 440px);
      padding: 24px;
      background: white;
      border: 1px solid #d9e1ec;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(18, 53, 91, .10);
    }

    h1 { margin-top: 0; color: #12355b; }
    p { line-height: 1.5; }

    #status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 9px;
      font-weight: 700;
      background: #e8eef6;
      color: #12355b;
    }

    .success {
      background: #e5f6ee !important;
      color: #13795b !important;
    }

    .error {
      background: #fdecea !important;
      color: #b42318 !important;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      border: 0;
      border-radius: 9px;
      background: #1d73c9;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Deadbeat Tracker</h1>
    <p>Supabase connection test</p>

    <div id="status">Checking connection...</div>

    <button type="button" onclick="testConnection()">
      Test Again
    </button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* Paste your existing Supabase values between the quotation marks. */
    const SUPABASE_URL = "https://jjffdtsohryyubmjnq.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Z8T064Vr5NmU6-ICT1EZbQ_pn4so7Oe";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function testConnection() {
      const status = document.getElementById("status");

      status.className = "";
      status.textContent = "Checking connection...";

      try {
        const { error } = await supabaseClient
          .from("trackers")
          .select("id")
          .limit(1);

        if (error) {
          /*
            A database permission message still proves the browser
            successfully contacted Supabase.
          */
          status.className = "success";
          status.textContent =
            "Connected to Supabase. Database replied: " + error.message;
          return;
        }

        status.className = "success";
        status.textContent =
          "Success — the browser connected to Supabase and reached the database.";
      } catch (error) {
        status.className = "error";
        status.textContent =
          "Connection failed: " + (error.message || "Unknown error");
      }
    }

    testConnection();
  </script>
</body>
</html>
